services:
  siseb-frontend-pprod:
    container_name: siseb-frontend-pprod

    restart: unless-stopped
    build:
      context: ../..
      dockerfile: docker/dockerfiles/Dockerfile@pprod
      tags: ['siseb-frontend-pprod']
    extra_hosts:
      - "keycloack.emes.bj:173.249.45.104"
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    networks:
      - siseb

  siseb-nginx-proxy-pprod:
    image: nginx:stable-alpine
    container_name: siseb-nginx-proxy-pprod
    restart: always
    volumes:
      - ../nginx/nginx.pprod.conf:/etc/nginx/nginx.conf
    ports:
      - "9500:80"
    depends_on:
      - siseb-frontend-pprod
    networks:
      - siseb

networks:
  siseb:
    external: true
